name: Release @expo/serve-emu

run-name: Release @expo/serve-emu (${{ inputs.bump }}) by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Only one release may calculate and publish the next version at a time.
concurrency:
  group: release-expo-serve-emu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.repository == 'expo/serve-emu' && github.ref == 'refs/heads/expo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout expo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: expo
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify npm bootstrap is complete
        run: |
          if ! npm view @expo/serve-emu version >/dev/null; then
            echo "::error::Bootstrap @expo/serve-emu on npm and configure its trusted publisher before running this workflow."
            exit 1
          fi

      - name: Create release commit
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          LAST_RUN_ID=$(git log -1 --format='%(trailers:key=Release-Run,valueonly)')
          if [ "$LAST_RUN_ID" = "$RELEASE_RUN_ID" ] && [ "$(git rev-parse HEAD^)" = "$DISPATCH_SHA" ]; then
            echo "Reusing the release commit created by this run."
          elif [ "$(git rev-parse HEAD)" != "$DISPATCH_SHA" ]; then
            echo "::error::expo moved after this release was started. Start a new release from the latest expo."
            exit 1
          else
            npm version "$BUMP" --no-git-tag-version --no-package-lock --no-workspaces-update --workspace packages/serve-emu
            VERSION=$(node -p "require('./packages/serve-emu/package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/serve-emu/package.json
            git commit -m "Release @expo/serve-emu $VERSION" -m "Release-Run: $RELEASE_RUN_ID"
          fi

          VERSION=$(node -p "require('./packages/serve-emu/package.json').version")
          TAG="@expo/serve-emu@$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          else
            git tag "$TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and typecheck
        run: |
          set -euo pipefail
          bun run test
          bun run typecheck

      - name: Create release package
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --workspace packages/serve-emu --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-emu.tgz

      - name: Verify release package
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(tar -xOf release/serve-emu.tgz package/package.json | jq -er .name)
          PACKAGE_VERSION=$(tar -xOf release/serve-emu.tgz package/package.json | jq -er .version)
          test "$PACKAGE_NAME" = "@expo/serve-emu"
          test "$PACKAGE_VERSION" = "$EXPECTED_VERSION"
          tar -tf release/serve-emu.tgz > /tmp/package-files.txt
          grep -Fxq package/dist/cli.js /tmp/package-files.txt
          grep -Fxq package/dist/ui/index.html /tmp/package-files.txt
          grep -Fxq package/vendor/scrcpy-server-v4.0 /tmp/package-files.txt
          tar -xOf release/serve-emu.tgz package/vendor/scrcpy-server-v4.0 \
            | sha256sum \
            | grep -Fxq "84924bd564a1eb6089c872c7521f968058977f91f5ff02514a8c74aff3210f3a  -"

      - name: Smoke test fresh package install
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init --yes >/dev/null
          bun add "$GITHUB_WORKSPACE/release/serve-emu.tgz"
          ./node_modules/.bin/serve-emu --help >/dev/null
          bun -e 'await import("@expo/serve-emu/middleware")'
          bun -e '
            const { createWebRtcPublisher } = await import(
              "./node_modules/@expo/serve-emu/dist/webrtc-publisher.js"
            );
            const publisher = await createWebRtcPublisher({
              settings: {
                transport: "webrtc",
                codec: "h264",
                iceServers: [],
                iceTransportPolicy: "all",
              },
              onKeyframeRequest() {},
            });
            publisher.close();
          '

      - name: Push release commit and tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git push --atomic origin HEAD:expo "refs/tags/$TAG"

      - name: Publish to npm with OIDC
        run: npm publish release/serve-emu.tgz --access public
